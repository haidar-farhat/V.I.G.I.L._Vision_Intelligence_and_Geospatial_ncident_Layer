[project]
name = "vigil"
version = "2.0.0a1"
description = "Sentinel Vision v2: local-first multi-camera incident intelligence."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    "keyring>=25",
    # The IANA time zone database, as a package. Windows ships no system copy,
    # so without this every site's clock silently falls back to UTC and a
    # schedule written in local hours fires at the wrong time. Pure data, no
    # network: it is a file, not a lookup.
    "tzdata>=2024.1",
    # The operator console. Native widgets, no embedded browser: a browser
    # engine would be a network stack inside an offline product.
    "PySide6>=6.7",
]

[project.scripts]
vigil = "vigil.interfaces.cli:main"
vigil-console = "vigil.interfaces.console.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]
# `vigil coverage` only. Union and difference over polygons with holes,
# degenerate rings and near-tangent edges is genuinely difficult and its bugs
# are invisible until one arrangement of cameras produces a wrong answer;
# a maintained computational-geometry library is better at it than anything
# written here. Optional because every other part of the product works
# without it, and the one that does not says so rather than crashing.
coverage = ["shapely>=2.0"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vigil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[package]
name = "vigil-core"
version = "1.0.0"
edition = "2021"
description = "VIGIL v2 engine core: camera geometry, association, tracking kernels, ground rasterisation. C ABI, no dependencies."
license = "MIT"

[lib]
name = "vigil_core"
# cdylib for the C ABI Python loads through ctypes; rlib so `cargo test` and
# any future Rust binary can link it directly.
crate-type = ["cdylib", "rlib"]

# Release only, and deliberately: `panic = "abort"` cannot be set on the dev
# profile without breaking `cargo test`, which needs unwinding for
# `#[should_panic]`. Every `extern "C"` export already gets an abort-on-unwind
# shim, so a panic can never unwind into Python under either profile.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]

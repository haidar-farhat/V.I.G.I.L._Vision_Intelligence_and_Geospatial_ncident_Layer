[package]
name = "sentinel-core"
version = "0.1.0"
edition = "2021"
description = "Sentinel Vision engine core: geometry, tracking, zones. C ABI, no dependencies."
license = "MIT"

[lib]
name = "sentinel_core"
# cdylib for the C ABI Python loads; rlib so Rust tests and future binaries can
# link it directly.
crate-type = ["cdylib", "rlib"]

# Release only, and deliberately. `panic = "abort"` cannot be set for the dev
# profile without breaking `cargo test`, which needs unwinding to catch a
# `#[should_panic]`. The asymmetry is safe because every `extern "C"` export
# already gets an abort-on-unwind shim from the compiler, so a panic can never
# unwind across the FFI boundary into Python under either profile — abort here is
# a smaller binary and a faster one, not the thing that makes the boundary sound.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]

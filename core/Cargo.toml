[package]
name = "sentinel-core"
version = "0.1.0"
edition = "2021"
description = "Sentinel Vision engine core: geometry, tracking, zones. C ABI, no dependencies."
license = "MIT"

[lib]
name = "sentinel_core"
# cdylib for the C ABI Python loads; rlib so Rust tests and future binaries can
# link it directly.
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]

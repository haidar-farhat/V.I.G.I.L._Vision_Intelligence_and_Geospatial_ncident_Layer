[project]
name = "sentinel-engine"
version = "0.1.0"
description = "Sentinel Vision engine: decode, detect, track, project, correlate."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
]

[project.scripts]
# The headless analyser. `python -m sentinel` works from a checkout without an
# install; this makes `sentinel` a command once installed.
sentinel = "sentinel.cli:main"

[project.optional-dependencies]
# `onnx` is a test-fixture dependency only: it builds the small model that makes
# the ONNX inference path executable in tests. Nothing at runtime imports it, and
# no model is ever downloaded.
dev = ["pytest>=8.0", "onnx>=1.16"]

# No network at runtime. Nothing here reaches the Internet, and nothing may be
# added that does: see docs/SECURITY.md.

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

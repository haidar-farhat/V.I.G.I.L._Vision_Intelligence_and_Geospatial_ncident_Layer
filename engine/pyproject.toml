[project]
name = "sentinel-engine"
version = "0.1.0"
description = "Sentinel Vision engine: decode, detect, track, project, correlate."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.20",
    # Polygon union and difference, for coverage and blind-spot analysis. That
    # geometry is genuinely hard — holes, degenerate rings, near-tangent edges —
    # and its bugs are invisible until one particular arrangement of cameras
    # produces a wrong answer. Offline: no sockets, no telemetry, three compiled
    # files carrying no endpoint, checked with tools/binary_audit.py before it
    # was adopted.
    "shapely>=2.0",
    # Camera passwords go to the operating system's keychain — Credential
    # Manager, the macOS Keychain, Secret Service — never to the database.
    # Pure Python, offline; its backends are the platform APIs. Where none is
    # usable (a container with no D-Bus) it is detected and nothing is stored.
    "keyring>=25",
]

[project.scripts]
# The headless analyser. `python -m sentinel` works from a checkout without an
# install; this makes `sentinel` a command once installed.
sentinel = "sentinel.cli:main"

[project.optional-dependencies]
# `onnx` is a test-fixture dependency only: it builds the small model that makes
# the ONNX inference path executable in tests. Nothing at runtime imports it, and
# no model is ever downloaded.
dev = ["pytest>=8.0", "onnx>=1.16"]

# No network at runtime. Nothing here reaches the Internet, and nothing may be
# added that does: see docs/SECURITY.md.

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

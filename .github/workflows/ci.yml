name: CI

# The suite must pass with no network access, because that is the product's
# central claim. The `offline` job below enforces it rather than trusting it.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheapest job, no toolchain, no dependencies: if the source names a cloud
  # SDK, an analytics package or an external host, nothing else is worth
  # running.
  offline-source:
    name: offline source audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No route off the site
        run: python tools/offline_audit.py

      # A broken diagram renders as raw text with no error anywhere, and every
      # architectural claim here is carried by one.
      - name: Every diagram parses
        run: python tools/docs_lint.py

  core:
    name: engine core (${{ matrix.os }})
    needs: offline-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The product ships on all three, so all three are checked.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Format
        working-directory: core
        run: cargo fmt --check

      - name: Lint
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: core
        run: cargo test

      - name: Build the shared library
        working-directory: core
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.os }}
          path: |
            core/target/release/*sentinel_core.so
            core/target/release/*sentinel_core.dylib
            core/target/release/sentinel_core.dll
          if-no-files-found: error

  engine:
    name: engine + console (${{ matrix.os }})
    needs: core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          # The floor stated in pyproject.toml. Development happens on 3.14;
          # testing the floor is what keeps that a real floor rather than a
          # number nobody checks.
          python-version: '3.12'
          cache: pip

      - name: Build the engine core
        working-directory: core
        run: cargo build --release

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev]"
          python -m pip install PySide6

      # Qt needs an X server on Linux even to paint offscreen-adjacent widgets.
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1

      - name: Engine tests
        working-directory: engine
        run: python -m pytest

      - name: Console tests
        working-directory: apps/console
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  container:
    name: container, no network
    needs: offline-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image builds its own Rust core, so no toolchain is needed here.
      - name: Build the test image
        run: docker build --target test -t sentinel-vision:test .

      # `--network none` is the whole point. The suite, the source audit and the
      # diagram lint all run with no route out of the container at all — the
      # offline claim tested the way an operator would test it.
      - name: The whole Python suite with no network at all
        run: |
          docker run --rm --network none sentinel-vision:test             "python tools/offline_audit.py && python tools/docs_lint.py && cd engine && python -m pytest -q"

      - name: The runtime image analyses a file with no network at all
        run: |
          docker build --target runtime -t sentinel-vision:local .
          docker run --rm --network none sentinel-vision:local --help

  package:
    name: standalone build (${{ matrix.os }})
    needs: engine
    # Only on main. The bundle is ~300 MB per platform and takes minutes; the
    # value is catching spec rot, which does not need to happen on every push to
    # a branch.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev]" PySide6 pyinstaller

      - name: Package
        run: python tasks.py package

      # The packaged analyser must actually run. A bundle that builds and cannot
      # start is the failure this job exists to catch, and it is invisible
      # without launching it.
      - name: The packaged analyser starts and finds its core
        shell: bash
        run: |
          BIN="dist/SentinelVision/sentinel"
          [ "$RUNNER_OS" = "Windows" ] && BIN="dist/SentinelVision/sentinel.exe"
          "$BIN" where
          # `coverage` calls into the Rust core, so this fails if the library
          # did not make it into the bundle.
          "$BIN" coverage --place 33.8938,35.5018,6,180,-22,62,36,90

      - uses: actions/upload-artifact@v4
        with:
          name: SentinelVision-${{ matrix.os }}
          path: dist/SentinelVision
          if-no-files-found: error

  offline:
    name: offline acceptance
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build the engine core
        working-directory: core
        run: cargo build --release

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "engine[dev]"
          python -m pip install PySide6
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libgl1

      # Everything above this line may use the network. Nothing below it may.
      # This is the product's central claim, and a claim nobody tests is a
      # claim that stops being true.
      - name: Block all outbound traffic except loopback
        run: |
          sudo iptables -P OUTPUT DROP
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          echo "outbound traffic blocked"

      - name: Prove the network is actually blocked
        run: |
          if timeout 5 curl -sS https://example.com >/dev/null 2>&1; then
            echo "outbound traffic still works; this job would prove nothing"
            exit 1
          fi
          echo "confirmed: no route out"

      - name: Rust tests with WAN blocked
        working-directory: core
        run: cargo test --offline

      - name: Engine tests with WAN blocked
        working-directory: engine
        run: python -m pytest

      - name: Console tests with WAN blocked
        working-directory: apps/console
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  # ------------------------------------------------------------------- v2
  #
  # The rewrite in v2/ is checked by its own workflow, .github/workflows/v2.yml,
  # which installs the Rust toolchain its engine core needs and builds an
  # installer per platform. It used to be two jobs here that installed no
  # toolchain, so the core's tests silently never ran.
